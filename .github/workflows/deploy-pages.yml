# Builds The Vault into plain files and publishes them to GitHub Pages
# (custom domain comes from public/CNAME). Runs on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Unknown paths on GitHub Pages fall back to the desktop instead of GitHub's 404 page.
      # The finished files land in dist/client or .output/public depending on the build setup.
      - name: Collect the finished site
        run: |
          for d in dist/client .output/public; do
            if [ -f "$d/index.html" ]; then SRC="$d"; break; fi
          done
          if [ -z "$SRC" ]; then echo "No index.html found in dist/client or .output/public"; exit 1; fi
          echo "Using $SRC"
          rm -rf site && cp -r "$SRC" site
          cp site/index.html site/404.html
          rm -f site/_headers site/_redirects
          ls -la site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
